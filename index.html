<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hue Harmony - 10 Levels</title>
    <!-- Desain tampilan langsung disematkan di sini agar simpel tanpa file CSS terpisah -->
    <style>
        body {
            background: #0d0b14;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.04);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff7eb3, #70a1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat-badge {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
        }
        p {
            color: #a0a0b0;
            font-size: 13px;
            line-height: 1.4;
            margin: 0 0 20px 0;
        }
        #game-board {
            display: grid;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            margin: 0 auto;
            width: fit-content;
        }
        .tile {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: transform 0.15s ease;
        }
        .tile:hover:not(.fixed) {
            transform: scale(1.08);
            z-index: 2;
        }
        .tile.fixed::after {
            content: "•";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
        }
        .tile.selected {
            outline: 3px solid #ffffff;
            transform: scale(1.08);
            z-index: 3;
            box-shadow: 0 0 15px rgba(255,255,255,0.7);
        }
        #msg {
            margin-top: 15px;
            font-weight: bold;
            color: #2ed573;
            min-height: 20px;
            font-size: 15px;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            background: #3a2e6b;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4c3d8c;
        }
        .btn-next {
            background: #2ed573;
            margin-left: 10px;
        }
        .btn-next:hover {
            background: #26af5f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HUE MATCHING</h1>
        
        <div class="stats-row">
            <!-- Di sini sudah diubah menjadi /10 dengan rapi -->
            <div class="stat-badge">⭐ Level: <span id="lvl">1</span>/10</div>
            <div class="stat-badge">⚡ Gerakan: <span id="moves">0</span></div>
        </div>

        <p>Susun kotak acak agar menjadi gradasi warna yang serasi sempurna. Kotak dengan tanda titik (•) adalah posisi tetap.</p>

        <div id="game-board"></div>
        
        <div id="msg"></div>
        
        <div>
            <button class="btn" onclick="initGame()">🔄 Acak Ulang</button>
            <button id="next-btn" class="btn btn-next" onclick="nextLevel()" style="display: none;">Level Berikutnya ➡️</button>
        </div>
    </div>

    <!-- Panggil file script.js eksternal -->
    <script src="script.js"></script>
</body>
</html>
